name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pytest pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build portable executable
        run: pyinstaller --noconfirm --onefile --windowed --name DentalPhotoSorter --paths src src/dental_photo_sorter/__main__.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: DentalPhotoSorter-Windows
          path: dist/DentalPhotoSorter.exe
          retention-days: 30
