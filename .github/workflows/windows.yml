name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pyinstaller
      - name: Compile all Python sources
        run: python -m compileall -q src tests
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Install ExifTool from Chocolatey package repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install exiftool -y --no-progress
          $binary = Get-ChildItem 'C:\ProgramData\chocolatey\lib\exiftool' -Recurse -File -Filter 'exiftool*.exe' | Select-Object -First 1
          if (-not $binary) { throw 'ExifTool executable missing from Chocolatey package' }
          New-Item -ItemType Directory -Path bundled-exiftool -Force | Out-Null
          Copy-Item -Path (Join-Path $binary.DirectoryName '*') -Destination bundled-exiftool -Recurse -Force
          $target = Get-ChildItem bundled-exiftool -Filter 'exiftool*.exe' | Select-Object -First 1
          if (-not $target) { throw 'ExifTool executable missing after copy' }
          Rename-Item -LiteralPath $target.FullName -NewName 'exiftool.exe'
          & .\bundled-exiftool\exiftool.exe -ver
          if ($LASTEXITCODE -ne 0) { throw 'ExifTool cannot execute' }
      - name: Build portable executable
        if: success()
        run: pyinstaller --noconfirm --onefile --windowed --name DentalPhotoSorter --paths src --collect-all pillow_heif --collect-all PIL --add-data "bundled-exiftool;exiftool" src/dental_photo_sorter/__main__.py
      - name: Verify bundled app can import
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from dental_photo_sorter.app import MainWindow; print('UI import OK')"
          if (!(Test-Path 'dist/DentalPhotoSorter.exe')) { throw 'Missing executable' }
          if ((Get-Item 'dist/DentalPhotoSorter.exe').Length -lt 1000000) { throw 'Executable unexpectedly small' }
      - name: Smoke-test the actual packaged EXE
        env:
          QT_QPA_PLATFORM: offscreen
          DENTAL_PHOTO_SORTER_HOME: ${{ runner.temp }}\dental-photo-sorter-smoke
        run: |
          & .\dist\DentalPhotoSorter.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged executable failed self-test: $LASTEXITCODE" }
      - name: Upload Windows executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DentalPhotoSorter-Windows
          path: dist/DentalPhotoSorter.exe
          retention-days: 90
          if-no-files-found: warn
