name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pyinstaller
      - name: Compile all Python sources
        run: python -m compileall -q src tests
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Download official ExifTool Windows distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $page = Invoke-WebRequest -Uri 'https://exiftool.org/' -UseBasicParsing
          $match = [regex]::Match($page.Content, 'exiftool-[0-9.]+_64\\.zip')
          if (-not $match.Success) { throw 'ExifTool Windows archive not found on official website' }
          $url = 'https://exiftool.org/' + $match.Value
          Invoke-WebRequest -Uri $url -OutFile exiftool.zip
          Expand-Archive -Path exiftool.zip -DestinationPath exiftool-unpacked
          $binary = Get-ChildItem exiftool-unpacked -Recurse -Filter 'exiftool(-k).exe' | Select-Object -First 1
          if (-not $binary) { throw 'ExifTool executable missing from archive' }
          New-Item -ItemType Directory -Path bundled-exiftool -Force | Out-Null
          Copy-Item -Path (Join-Path $binary.DirectoryName '*') -Destination bundled-exiftool -Recurse -Force
          if (Test-Path 'bundled-exiftool/exiftool(-k).exe') { Rename-Item 'bundled-exiftool/exiftool(-k).exe' 'exiftool.exe' }
          & .\\bundled-exiftool\\exiftool.exe -ver
          if ($LASTEXITCODE -ne 0) { throw 'ExifTool cannot execute' }
      - name: Build portable executable
        if: always()
        run: pyinstaller --noconfirm --onefile --windowed --name DentalPhotoSorter --paths src --collect-all pillow_heif --collect-all PIL --add-data "bundled-exiftool;exiftool" src/dental_photo_sorter/__main__.py
      - name: Verify bundled app can import
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from dental_photo_sorter.app import MainWindow; print('UI import OK')"
          if (!(Test-Path 'dist/DentalPhotoSorter.exe')) { throw 'Missing executable' }
          if ((Get-Item 'dist/DentalPhotoSorter.exe').Length -lt 1000000) { throw 'Executable unexpectedly small' }
      - name: Smoke-test the actual packaged EXE
        env:
          QT_QPA_PLATFORM: offscreen
          DENTAL_PHOTO_SORTER_HOME: ${{ runner.temp }}\\dental-photo-sorter-smoke
        run: |
          & .\\dist\\DentalPhotoSorter.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged executable failed self-test: $LASTEXITCODE" }
      - name: Upload Windows executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DentalPhotoSorter-Windows
          path: dist/DentalPhotoSorter.exe
          retention-days: 90
          if-no-files-found: warn
