name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pytest pyinstaller
      - name: Compile all Python sources
        run: python -m compileall -q src tests
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build portable executable
        run: pyinstaller --noconfirm --onefile --windowed --name DentalPhotoSorter --paths src src/dental_photo_sorter/__main__.py
      - name: Verify bundled app can import
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from dental_photo_sorter.app import MainWindow; print('UI import OK')"
          if (!(Test-Path 'dist/DentalPhotoSorter.exe')) { throw 'Missing executable' }
          if ((Get-Item 'dist/DentalPhotoSorter.exe').Length -lt 1000000) { throw 'Executable unexpectedly small' }
      - name: Smoke-test the actual packaged EXE
        env:
          QT_QPA_PLATFORM: offscreen
          DENTAL_PHOTO_SORTER_HOME: ${{ runner.temp }}\\dental-photo-sorter-smoke
        run: |
          & .\\dist\\DentalPhotoSorter.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged executable failed self-test: $LASTEXITCODE" }
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: DentalPhotoSorter-Windows
          path: dist/DentalPhotoSorter.exe
          retention-days: 90
